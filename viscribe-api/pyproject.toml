[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viscribe-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.9,<3",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
